<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PROTECTION ANTI-CACHE POUR WECHAT ET LES NAVIGATEURS -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Menu | La Lupita x Revolucion</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0907; 
            --card-bg: #161310; 
            --text-main: #ffffff; 
            --text-muted: #9ca3af; 
            --text-cn: #6b7280; 
            --accent-lupita: #f5a623; 
            --accent-revo: #e11d48; 
            --border-color: #26221d; 
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: relative;
            background-color: rgba(11, 9, 7, 0.95);
            backdrop-filter: blur(10px); 
            z-index: 1000; 
            border-bottom: 1px solid var(--border-color); 
        }

        .header-logos-row {
            display: flex; justify-content: center; align-items: center; gap: 20px;
            padding: 12px 15px 8px 15px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .header-dropdowns-row {
            display: flex; flex-direction: column; align-items: center;
            padding: 10px 15px; position: relative;
        }

        .img-revo { height: 150px; width: auto; object-fit: contain; mix-blend-mode: screen; margin-top: 10px; }
        .img-lupita { height: 160px; width: auto; object-fit: contain; mix-blend-mode: screen; }
        .img-halal { height: 80px; width: auto; object-fit: contain; mix-blend-mode: screen; }

        /* BRAND DROPDOWN */
        .brand-dropdown-container {
            display: flex; gap: 15px; align-items: center; justify-content: center; width: 100%;
        }
        
        .brand-pill {
            background: #e6e4df; border: 1px solid var(--border-color); border-radius: 30px;
            padding: 8px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.3s ease;
            color: #0b0907;
        }
        .brand-pill:hover { border-color: #57483b; }
        .brand-pill:not(.active) { background: #1a1612; color: #fff; }
        .brand-pill-info { display: flex; flex-direction: column; }
        .brand-title { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 700; }
        .brand-sub { font-size: 0.65rem; color: #57534e; text-transform: uppercase; letter-spacing: 1px; }
        .brand-pill:not(.active) .brand-sub { color: var(--text-muted); }
        
        .arrow-icon { 
            width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
            transform: rotate(45deg); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); margin-top: -3px;
        }
        .brand-pill.open .arrow-icon { transform: rotate(-135deg); margin-top: 3px; }

        /* MENU DÉROULANT */
        .dropdown-menu-box {
            display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%) translateY(-10px); width: 90%; max-width: 450px; margin-top: 2px;
            background: #1c1917; border: 1px solid var(--border-color); border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.95); z-index: 99999; padding: 10px 0;
            backdrop-filter: blur(12px); opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .dropdown-menu-box.active { display: block; opacity: 1; transform: translateX(-50%) translateY(0); }
        
        .dropdown-item {
            padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: background 0.2s, padding-left 0.2s; border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .dropdown-item:hover { background: rgba(255,255,255,0.08); padding-left: 24px; }
        .dropdown-item:last-child { border-bottom: none; }
        
        .dropdown-item-en { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 600; color: #fff; }
        .dropdown-item-cn { font-size: 0.9rem; color: var(--text-cn); }

        /* SOUS-NAVIGATION HORIZONTALE */
        .sub-category-nav {
            display: none; overflow-x: auto; padding: 10px 15px; gap: 8px; scrollbar-width: none; background: #0b0907;
            border-bottom: 1px solid var(--border-color);
        }
        .sub-category-nav.active-subnav { display: flex; }
        .sub-category-nav::-webkit-scrollbar { display: none; }

        .sub-tab {
            background: transparent; border: none; color: var(--text-muted); font-size: 0.85rem;
            white-space: nowrap; padding: 6px 12px; border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        .sub-tab.active { color: #ffffff; background: rgba(255, 255, 255, 0.1); font-weight: 600; }

        /* GRILLE DE PRODUITS AVEC ANIMATION D'APPARITION */
        .menu-container {
            padding: 20px 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px; padding-bottom: 100px; max-width: 1200px; margin: 0 auto;
            animation: fadeIn 0.35s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .subcategory-title-wrapper {
            grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin-top: 20px; margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color); padding-bottom: 6px;
        }
        .subcategory-title {
            font-size: 1.3rem; color: var(--text-main);
            font-family: 'Cormorant Garamond', serif; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 0;
        }

        .product-card {
            background-color: var(--card-bg); border-radius: 12px; overflow: hidden;
            display: flex; flex-direction: column; cursor: pointer;
            border: 1px solid var(--border-color); position: relative;
            aspect-ratio: 16/10; transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.6); }
        
        .product-img { 
            width: 100%; height: 100%; 
            position: absolute; top: 0; left: 0; z-index: 1; 
        }
        
        .product-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; height: 75%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
            z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; padding: 15px;
            pointer-events: none;
        }

        .add-btn-corner {
            position: absolute; top: 10px; right: 10px; width: 24px; height: 24px;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: #ffffff; font-size: 0.9rem; font-weight: 300; z-index: 3;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
            border: 1.2px solid var(--btn-color, #f5a623);
            transition: transform 0.2s;
        }
        .product-card:hover .add-btn-corner { transform: scale(1.1); }
        
        .product-name-en { 
            font-size: 1.15rem; font-family: 'Cormorant Garamond', serif; font-weight: 600; color: #ffffff; margin-bottom: 2px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .allergens { font-size: 0.85rem; letter-spacing: 2px; }
        .product-name-cn { font-size: 0.85rem; color: #d1d5db; margin-bottom: 8px; font-weight: 400; }
        
        .product-bottom { display: flex; justify-content: space-between; align-items: baseline; }
        .product-price { font-size: 1.15rem; font-weight: 600; color: #f3f4f6; font-family: 'Cormorant Garamond', serif; }

        /* SHISHA LAYOUT */
        .shisha-container { 
            grid-column: 1 / -1; 
            display: flex; gap: 30px; 
            padding: 20px 0; 
            align-items: stretch;
            animation: fadeIn 0.35s ease-in-out;
        }
        @media (max-width: 768px) {
            .shisha-container { flex-direction: column; align-items: stretch; }
        }
        .shisha-image-col {
            flex: 0 0 35%;
            max-width: 350px;
            display: flex;
        }
        .shisha-image-col img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }
        .shisha-list-col {
            flex: 1;
            display: flex; flex-direction: column; gap: 20px;
            width: 100%;
        }
        .shisha-series-title { 
            font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: #ffffff; 
            border-bottom: 1px solid var(--border-color); padding-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .shisha-series-title span { color: var(--text-cn); font-size: 1rem; }
        .shisha-item { 
            display: flex; justify-content: space-between; align-items: flex-start; 
            padding: 10px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); 
        }
        .shisha-names h4 { margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 10px; }
        .shisha-names h4 span { color: var(--text-muted); font-size: 0.95rem; font-weight: 400; font-family: 'Montserrat', sans-serif;}
        .shisha-desc { margin: 4px 0 0 0; font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }
        .shisha-price { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 600; color: #f3f4f6; white-space: nowrap; margin-left: 20px; }

        /* MODALE */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 200000; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.3s ease;
        }
        .modal.active { display: flex; opacity: 1; }
        .modal-content {
            background-color: var(--card-bg); width: 90%; max-width: 400px; 
            border-radius: 16px; overflow: hidden; position: relative; max-height: 95vh; overflow-y: auto;
            border: 1px solid var(--border-color); transform: scale(0.92); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal.active .modal-content { transform: scale(1); }
        .close-btn {
            position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6);
            color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; z-index: 10;
        }
        .modal-img { 
            width: 100%; 
            background-color: #2c2825; 
        }
        .modal-body { padding: 20px; }
        .modal-title-wrapper { display: flex; justify-content: space-between; align-items: center;}
        
        #modalNameEn { margin: 0; font-size: 1.5rem; font-family: 'Cormorant Garamond', serif; color: #fff;}
        #modalAllergens { font-size: 1rem; }
        #modalNameCn { color: var(--text-cn); font-size: 0.95rem; margin-top: 2px; margin-bottom: 12px; }
        #modalPrice { font-size: 1.4rem; font-weight: 600; margin-bottom: 15px; font-family: 'Cormorant Garamond', serif; color: #f3f4f6;}
        #modalDesc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; border-top: 1px solid var(--border-color); padding-top: 12px;}
    </style>
</head>
<body>

    <header>
        <!-- ÉTAGE 1 : LES 3 LOGOS CÔTE À CÔTE (REVO EN PREMIER) -->

                <div class="dropdown-item" onclick="selectCategory('revo', 'softs', 'Soft Drinks', '#94a3b8')">

                </div>

                </div>
            </div>
        </div>

        <div class="sub-category-nav active-subnav" id="subnav-container"></div>
    </header>

    <main class="menu-container" id="mainMenuContainer"></main>

    <div class="modal" id="productModal">

        function toggleDropdown(brand) {
            const boxLupita = document.getElementById('dropdown-lupita');
            const boxRevo = document.getElementById('dropdown-revo');
            const pillLupita = document.getElementById('pill-lupita');
            const pillRevo = document.getElementById('pill-revo');

            if(brand === 'lupita') {
                const isOpen = boxLupita.classList.contains('active');
                boxLupita.classList.toggle('active', !isOpen);
                boxRevo.classList.remove('active');
                pillLupita.classList.toggle('open', !isOpen);
                pillRevo.classList.remove('open');
            } else {
                const isOpen = boxRevo.classList.contains('active');
                boxRevo.classList.toggle('active', !isOpen);
                boxLupita.classList.remove('active');
                pillRevo.classList.toggle('open', !isOpen);
                pillLupita.classList.remove('open');
            }
        }

        function selectCategory(brand, catKey, title, color) {
            currentCategoryColor = color;
            document.getElementById('dropdown-lupita').classList.remove('active');
            document.getElementById('dropdown-revo').classList.remove('active');
            document.getElementById('pill-lupita').classList.remove('open');
            document.getElementById('pill-revo').classList.remove('open');

            const pillLupita = document.getElementById('pill-lupita');
            const pillRevo = document.getElementById('pill-revo');

            if(brand === 'lupita') {
                pillLupita.classList.add('active');
                pillRevo.classList.remove('active');
                buildSubNavLupita(catKey);
                renderGrid(catKey, false);
            } else {
                pillRevo.classList.add('active');
                pillLupita.classList.remove('active');
                document.getElementById('subnav-container').innerHTML = '';
                if(catKey === 'shisha') {
                    renderShisha(menuData.revo.shisha);
                } else {
                    renderGrid(catKey, true);
                }
            }
        }

        function buildSubNavLupita(catKey) {
            const subNav = document.getElementById('subnav-container');
            subNav.classList.add('active-subnav');
            subNav.innerHTML = '';

            if(catKey === 'finger') {
                subNav.innerHTML = `
                    <button class="sub-tab active" onclick="scrollToSub('lupita-sub-bar')">Bar snacks & Appetizers 酒吧小吃</button>
                    <button class="sub-tab" onclick="scrollToSub('lupita-sub-ceviches')">Ceviches 酸橘汁腌鱼</button>
                `;
            } else if(catKey === 'platos') {
                subNav.innerHTML = `
                    <button class="sub-tab active" onclick="scrollToSub('sub-quesa')">Quesadillas 煎饼</button>
                    <button class="sub-tab" onclick="scrollToSub('sub-burritos')">Burritos 卷饼</button>
                    <button class="sub-tab" onclick="scrollToSub('sub-burgers')">Burgers 汉堡</button>
                    <button class="sub-tab" onclick="scrollToSub('sub-grilled')">Grilled 烤肉</button>
                    <button class="sub-tab" onclick="scrollToSub('sub-bowls')">Bowls 沙拉碗</button>
                    <button class="sub-tab" onclick="scrollToSub('sub-specialities')">Specialities 特色菜</button>
                `;
            } else if(catKey === 'tacos') {
                subNav.innerHTML = `
                    <button class="sub-tab active" onclick="scrollToSub('sub-tacos3')">Tacos (3 pcs) 塔可</button>
                    <button class="sub-tab" onclick="scrollToSub('sub-board')">Tacos Board 塔可拼盘</button>
                `;
            } else if(catKey === 'desserts') {
                subNav.innerHTML = `<button class="sub-tab active" onclick="scrollToSub('sub-desserts')">Desserts 甜点</button>`;
            } else if(catKey === 'happy') {
                subNav.innerHTML = `<button class="sub-tab active" onclick="scrollToSub('sub-happy')">Happy Hours 欢乐时光</button>`;
            }
        }

        function renderGrid(catKey, isRevo) {
            const container = document.getElementById('mainMenuContainer');
            let html = '';
            
            let dataGroups = isRevo ? menuData.revo[catKey] : menuData.lupita[catKey];
            
            dataGroups.forEach((group, gIndex) => {
                let badgeColor = isRevo ? 'e11d48' : 'f5a623';
                
                html += `
                    <div id="${group.id}" class="subcategory-title-wrapper">
                        <div class="subcategory-title">${group.subcategory}</div>
                    </div>`;
                
                group.items.forEach((p, iIndex) => {
                    let safeNameEn = p[0] || '';
                    let safeNameCn = p[1] || '';
                    
                    let nameForAlt = safeNameEn.replace(/"/g, '&quot;');
                    
                    let cnDisplay = safeNameCn ? `<div class="product-name-cn">${safeNameCn}</div>` : '';
                    let allergens = p[4] || '';
                    let safePrice = p[3] || '';
                    
                    let imgPath = p[5];
                    let imgSrc = (imgPath && imgPath !== 'undefined' && imgPath !== 'NaN') ? imgPath : `https://via.placeholder.com/400x250/161310/${badgeColor}?text=${encodeURIComponent(safeNameEn.substring(0, 12))}`;

                    let imgPos = p[6] || 'center';
                    let imgTrans = p[7] || 'scale(1)';

                    html += `
                        <div class="product-card" style="--btn-color: ${currentCategoryColor};" onclick="openModal('${catKey}', ${gIndex}, ${iIndex}, ${isRevo})">
                            <div class="add-btn-corner">+</div>
                            <img class="product-img" src="${imgSrc}" alt="${nameForAlt}" style="object-fit: cover; object-position: ${imgPos}; transform: ${imgTrans};">
                            <div class="product-overlay">
                                <div class="product-name-en">
                                    <span>${safeNameEn}</span>
                                    <span class="allergens">${allergens}</span>
                                </div>
                                ${cnDisplay}
                                <div class="product-bottom">
                                    <div class="product-price">${safePrice}</div>
                                </div>
                            </div>
                        </div>`;
                });
            });
            container.innerHTML = html;
        }

        function renderShisha(shishaData) {
            document.getElementById('subnav-container').classList.remove('active-subnav');
            const container = document.getElementById('mainMenuContainer');
            
            let html = `
            <div class="shisha-container">
                <div class="shisha-image-col">
                    <img src="shisha.jpeg" alt="Shisha Menu">
                </div>
                <div class="shisha-list-col">`;
            
            shishaData.forEach(series => {
                let seriesNameParts = series.subcategory.split('—');
                let enTitle = seriesNameParts[0] ? seriesNameParts[0].trim() : series.subcategory;
                let cnTitle = seriesNameParts[1] ? seriesNameParts[1].trim() : '';

                html += `<div class="shisha-series-title">${enTitle} <span>${cnTitle}</span></div>`;
                series.items.forEach(item => {
                    let safeNameEn = item[0] || '';
                    let safeDesc = item[2] || '';
                    let safePrice = item[3] || '';

                    html += `
                        <div class="shisha-item">
                            <div class="shisha-names">
                                <h4>${safeNameEn} <span>${item[1] || ''}</span></h4>
                                <div class="shisha-desc">${safeDesc}</div>
                            </div>
                            <div class="shisha-price">${safePrice}</div>
                        </div>`;
                });
            });
            
            html += `
                </div>
            </div>`;
            container.innerHTML = html;
        }

        function scrollToSub(subId) {
            const el = document.getElementById(subId);
            if(el) {
                const headerOffset = 160;
                const elementPosition = el.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                window.scrollTo({ top: offsetPosition, behavior: "smooth" });
            }
            document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');
        }

        const modal = document.getElementById('productModal');
        function openModal(catKey, gIndex, iIndex, isRevo) {
            let dataGroups = isRevo ? menuData.revo[catKey] : menuData.lupita[catKey];
            let p = dataGroups[gIndex].items[iIndex];
            
            let nameEn = p[0] || '';
            let nameCn = p[1] || '';
            let desc = p[2] || '';
            let price = p[3] || '';
            let allergens = p[4] || '';
            let imgPath = p[5];
            let imgPos = p[6] || 'center';
            let imgTrans = p[7] || 'scale(1)';

            document.getElementById('modalNameEn').innerHTML = nameEn;
            document.getElementById('modalAllergens').innerHTML = allergens;
            document.getElementById('modalDesc').innerHTML = desc;
            document.getElementById('modalPrice').innerHTML = price;
            
            let cnEl = document.getElementById('modalNameCn');
            if (nameCn && nameCn.trim() !== '') {
                cnEl.innerHTML = nameCn;
                cnEl.style.display = 'block';
            } else {
                cnEl.style.display = 'none';
            }
            
            let badgeColor = isRevo ? 'e11d48' : 'f5a623';
            let imgSrc = (imgPath && imgPath !== 'undefined' && imgPath !== 'NaN') ? imgPath : `https://via.placeholder.com/600x450/161310/${badgeColor}?text=${encodeURIComponent(nameEn.substring(0, 12))}`;
            
            let modalImgEl = document.getElementById('modalImg');
            modalImgEl.src = imgSrc;
            
            if (isRevo) {
                modalImgEl.style.aspectRatio = '4/5'; 
                modalImgEl.style.objectFit = 'cover';
            } else {
                modalImgEl.style.aspectRatio = '4/3';
                modalImgEl.style.objectFit = 'cover';
            }
            
            modalImgEl.style.objectPosition = imgPos;
            modalImgEl.style.transform = imgTrans;
            
            modal.classList.add('active');
        }

        function closeModal() { modal.classList.remove('active'); }
        window.onclick = function(event) { if (event.target == modal) closeModal(); }

        selectCategory('lupita', 'finger', 'Finger Food', '#f5a623');
    </script>
