<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu | La Lupita x Revolucion</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0907; 
            --card-bg: #161310; 
            --text-main: #ffffff; 
            --text-muted: #9ca3af; 
            --text-cn: #6b7280; 
            --accent-lupita: #f5a623; 
            --accent-revo: #e11d48; 
            --border-color: #26221d; 
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* HEADER RECONSTRUIT : LOGOS - BOUTONS - HALAL EN UNE LIGNE */
        header {
            position: sticky; top: 0; background-color: rgba(11, 9, 7, 0.95);
            backdrop-filter: blur(10px); z-index: 100; 
            border-bottom: 1px solid var(--border-color); 
        }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; overflow-x: auto; white-space: nowrap; scrollbar-width: none;
        }
        .header-top::-webkit-scrollbar { display: none; }
        
        .header-left-group {
            display: flex; align-items: center; gap: 20px;
        }

        .img-lupita { 
            height: 140px; width: auto; object-fit: contain; mix-blend-mode: screen; 
        }
        .img-revo { 
            height: 140px; width: auto; object-fit: contain; mix-blend-mode: screen; margin-right: 10px;
        }
        .img-halal { 
            height: 80px; width: auto; object-fit: contain; mix-blend-mode: screen; margin-left: 20px;
        }

        /* BRAND DROPDOWN */
        .brand-dropdown-container {
            display: flex; gap: 15px; align-items: center; justify-content: center;
        }
        
        .brand-pill {
            background: #e6e4df; border: 1px solid var(--border-color); border-radius: 30px;
            padding: 8px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.3s ease;
            color: #0b0907;
        }
        .brand-pill:hover { border-color: #57483b; }
        .brand-pill:not(.active) { background: #1a1612; color: #fff; }
        .brand-pill-info { display: flex; flex-direction: column; }
        .brand-title { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 700; }
        .brand-sub { font-size: 0.65rem; color: #57534e; text-transform: uppercase; letter-spacing: 1px; }
        .brand-pill:not(.active) .brand-sub { color: var(--text-muted); }
        
        .arrow-icon { 
            width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
            transform: rotate(45deg); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); margin-top: -3px;
        }
        .brand-pill.open .arrow-icon { transform: rotate(-135deg); margin-top: 3px; }

        /* MENU FLOTTANT DES CATÉGORIES */
        .dropdown-menu-box {
            display: none; position: absolute; top: 75px; left: 15px; right: 15px; max-width: 450px; margin: 0 auto;
            background: #1c1917; border: 1px solid var(--border-color); border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); z-index: 150; padding: 10px 0;
            backdrop-filter: blur(12px); opacity: 0; transform: translateY(-10px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dropdown-menu-box.active { display: block; opacity: 1; transform: translateY(0); }
        
        .dropdown-item {
            padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: background 0.2s; border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .dropdown-item:hover { background: rgba(255,255,255,0.05); }
        .dropdown-item-en { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 600; color: #fff; }
        .dropdown-item-cn { font-size: 0.9rem; color: var(--text-cn); }

        /* SOUS-NAVIGATION HORIZONTALE */
        .sub-category-nav {
            display: none; overflow-x: auto; padding: 10px 15px; gap: 8px; scrollbar-width: none; background: #0b0907;
            border-bottom: 1px solid var(--border-color);
        }
        .sub-category-nav.active-subnav { display: flex; }
        .sub-category-nav::-webkit-scrollbar { display: none; }

        .sub-tab {
            background: transparent; border: none; color: var(--text-muted); font-size: 0.85rem;
            white-space: nowrap; padding: 6px 12px; border-radius: 12px; cursor: pointer; transition: 0.2s;
        }
        .sub-tab.active { color: #ffffff; background: rgba(255, 255, 255, 0.1); font-weight: 600; }

        /* GRILLE DE PRODUITS */
        .menu-container {
            padding: 20px 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px; padding-bottom: 100px; max-width: 1200px; margin: 0 auto;
        }

        .subcategory-title-wrapper {
            grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; margin-top: 20px; margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color); padding-bottom: 6px;
        }
        .subcategory-title {
            font-size: 1.3rem; color: var(--text-main);
            font-family: 'Cormorant Garamond', serif; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 0;
        }

        .product-card {
            background-color: var(--card-bg); border-radius: 12px; overflow: hidden;
            display: flex; flex-direction: column; cursor: pointer;
            border: 1px solid var(--border-color); position: relative;
            aspect-ratio: 16/10; transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        .product-img { 
            width: 100%; height: 100%; 
            position: absolute; top: 0; left: 0; z-index: 1; 
        }
        
        .product-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; height: 75%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
            z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; padding: 15px;
            pointer-events: none;
        }

        .add-btn-corner {
            position: absolute; top: 10px; right: 10px; width: 24px; height: 24px;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: #ffffff; font-size: 0.9rem; font-weight: 300; z-index: 3;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
            border: 1.2px solid var(--btn-color, #f5a623);
            transition: transform 0.2s;
        }
        
        .product-name-en { 
            font-size: 1.15rem; font-family: 'Cormorant Garamond', serif; font-weight: 600; color: #ffffff; margin-bottom: 2px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .allergens { font-size: 0.85rem; letter-spacing: 2px; }
        .product-name-cn { font-size: 0.85rem; color: #d1d5db; margin-bottom: 8px; font-weight: 400; }
        
        .product-bottom { display: flex; justify-content: space-between; align-items: baseline; }
        .product-price { font-size: 1.15rem; font-weight: 600; color: #f3f4f6; font-family: 'Cormorant Garamond', serif; }

        /* SHISHA STYLE LISTE */
        .shisha-container { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 25px; padding: 10px 0; }
        .shisha-series-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; color: #ffffff; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .shisha-series-title span { color: var(--text-cn); font-size: 1rem; }
        .shisha-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
        .shisha-names h4 { margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 600; color: #fff; }
        .shisha-names h4 span { color: var(--text-cn); font-size: 0.9rem; font-weight: 400; margin-left: 8px; }
        .shisha-desc { margin: 4px 0 0 0; font-size: 0.85rem; color: var(--text-muted); line-height: 1.3; }
        .shisha-desc-cn { font-size: 0.8rem; color: var(--text-cn); }
        .shisha-price { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 600; color: #f3f4f6; white-space: nowrap; margin-left: 15px; }

        /* MODALE */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 200; align-items: center; justify-content: center;
            backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.3s ease;
        }
        .modal.active { display: flex; opacity: 1; }
        .modal-content {
            background-color: var(--card-bg); width: 90%; max-width: 400px; 
            border-radius: 16px; overflow: hidden; position: relative; max-height: 95vh; overflow-y: auto;
            border: 1px solid var(--border-color); transform: scale(0.95); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal.active .modal-content { transform: scale(1); }
        .close-btn {
            position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6);
            color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; z-index: 10;
        }
        .modal-img { 
            width: 100%; 
            background-color: #2c2825; 
        }
        .modal-body { padding: 20px; }
        .modal-title-wrapper { display: flex; justify-content: space-between; align-items: center;}
        
        #modalNameEn { margin: 0; font-size: 1.5rem; font-family: 'Cormorant Garamond', serif; color: #fff;}
        #modalAllergens { font-size: 1rem; }
        #modalNameCn { color: var(--text-cn); font-size: 0.95rem; margin-top: 2px; margin-bottom: 12px; }
        #modalPrice { font-size: 1.4rem; font-weight: 600; margin-bottom: 15px; font-family: 'Cormorant Garamond', serif; color: #f3f4f6;}
        #modalDesc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; border-top: 1px solid var(--border-color); padding-top: 12px;}
    </style>
</head>

        function toggleDropdown(brand) {
            const boxLupita = document.getElementById('dropdown-lupita');
            const boxRevo = document.getElementById('dropdown-revo');
            const pillLupita = document.getElementById('pill-lupita');
            const pillRevo = document.getElementById('pill-revo');

            if(brand === 'lupita') {
                const isOpen = boxLupita.classList.contains('active');
                boxLupita.classList.toggle('active', !isOpen);
                boxRevo.classList.remove('active');
                pillLupita.classList.toggle('open', !isOpen);
                pillRevo.classList.remove('open');
            } else {
                const isOpen = boxRevo.classList.contains('active');
                boxRevo.classList.toggle('active', !isOpen);
                boxLupita.classList.remove('active');
                pillRevo.classList.toggle('open', !isOpen);
                pillLupita.classList.remove('open');
            }
        }

        function selectCategory(brand, catKey, title, color) {
            currentCategoryColor = color;
            document.getElementById('dropdown-lupita').classList.remove('active');
            document.getElementById('dropdown-revo').classList.remove('active');
            document.getElementById('pill-lupita').classList.remove('open');
            document.getElementById('pill-revo').classList.remove('open');

            const pillLupita = document.getElementById('pill-lupita');
            const pillRevo = document.getElementById('pill-revo');

            if(brand === 'lupita') {
                pillLupita.classList.add('active');
                pillRevo.classList.remove('active');
                buildSubNavLupita(catKey);
                renderGrid(menuData.lupita[catKey], false);
            } else {
                pillRevo.classList.add('active');
                pillLupita.classList.remove('active');
                document.getElementById('subnav-container').innerHTML = '';
                if(catKey === 'shisha') {
                    renderShisha(menuData.revo.shisha);
                } else {
                    renderGrid(menuData.revo[catKey], true);
                }
            }
        }

        function buildSubNavLupita(catKey) {
            const subNav = document.getElementById('subnav-container');
            subNav.classList.add('active-subnav');
            subNav.innerHTML = '';

            if(catKey === 'finger') {
                subNav.innerHTML = `
                    <button class="sub-tab active" onclick="scrollToSub('lupita-sub-bar')">Bar snacks & Appetizers</button>
                    <button class="sub-tab" onclick="scrollToSub('lupita-sub-ceviches')">Ceviches</button>
                `;
            } else if(catKey === 'platos') {
                subNav.innerHTML = `
                    <button class="sub-tab active" onclick="scrollToSub('sub-quesa')">Quesadillas</button>
                    <button class="sub-tab" onclick="scrollToSub('sub-burritos')">Burritos</button>
                    <button class="sub-tab" onclick="scrollToSub('sub-burgers')">Burgers</button>
                    <button class="sub-tab" onclick="scrollToSub('sub-grilled')">Grilled</button>
                    <button class="sub-tab" onclick="scrollToSub('sub-bowls')">Bowls</button>
                    <button class="sub-tab" onclick="scrollToSub('sub-specialities')">Specialities</button>
                `;
            } else if(catKey === 'tacos') {
                subNav.innerHTML = `
                    <button class="sub-tab active" onclick="scrollToSub('sub-tacos3')">Tacos (3 pcs)</button>
                    <button class="sub-tab" onclick="scrollToSub('sub-board')">Tacos Board</button>
                `;
            } else if(catKey === 'desserts') {
                subNav.innerHTML = `<button class="sub-tab active" onclick="scrollToSub('sub-desserts')">Desserts</button>`;
            } else if(catKey === 'happy') {
                subNav.innerHTML = `<button class="sub-tab active" onclick="scrollToSub('sub-happy')">Happy Hours</button>`;
            }
        }

        function renderGrid(dataGroups, isRevo) {
            const container = document.getElementById('mainMenuContainer');
            let html = '';
            
            dataGroups.forEach((group) => {
                let badgeColor = isRevo ? 'e11d48' : 'f5a623';
                
                html += `
                    <div id="${group.id}" class="subcategory-title-wrapper">
                        <div class="subcategory-title">${group.subcategory}</div>
                    </div>`;
                
                group.items.forEach(p => {
                    let safeNameEn = p[0].replace(/'/g, '&#39;').replace(/"/g, '&quot;');
                    let safeNameCn = p[1].replace(/'/g, '&#39;').replace(/"/g, '&quot;');
                    let safeDesc = p[2].replace(/'/g, '&#39;').replace(/"/g, '&quot;');
                    let safePrice = p[3].replace(/'/g, '&#39;').replace(/"/g, '&quot;');
                    let allergens = p[4] ? p[4] : '';
                    let cnDisplay = p[1] ? `<div class="product-name-cn">${p[1]}</div>` : '';
                    
                    let imgPath = p[5];
                    let imgSrc = (imgPath && imgPath !== 'undefined' && imgPath !== 'NaN') ? imgPath : `https://via.placeholder.com/400x250/161310/${badgeColor}?text=${encodeURIComponent(p[0].substring(0, 12))}`;

                    /* Récupération des réglages sur-mesure pour chaque photo (Position et Zoom) */
                    let imgPos = p[6] ? p[6] : 'center';
                    let imgTrans = p[7] ? p[7] : 'scale(1)';

                    html += `
                        <div class="product-card" style="--btn-color: ${currentCategoryColor};" onclick="openModal('${safeNameEn}', '${safeNameCn}', '${safeDesc}', '${safePrice}', '${allergens}', '${imgPath}', ${isRevo}, '${imgPos}', '${imgTrans}')">
                            <div class="add-btn-corner">+</div>
                            <img class="product-img" src="${imgSrc}" alt="${p[0]}" style="object-fit: cover; object-position: ${imgPos}; transform: ${imgTrans};">
                            <div class="product-overlay">
                                <div class="product-name-en">
                                    <span>${p[0]}</span>
                                    <span class="allergens">${allergens}</span>
                                </div>
                                ${cnDisplay}
                                <div class="product-bottom">
                                    <div class="product-price">${p[3]}</div>
                                </div>
                            </div>
                        </div>`;
                });
            });
            container.innerHTML = html;
        }

        function renderShisha(shishaData) {
            document.getElementById('subnav-container').classList.remove('active-subnav');
            const container = document.getElementById('mainMenuContainer');
            let html = '<div class="shisha-container">';
            
            shishaData.forEach(series => {
                html += `<div class="shisha-series-title">${series.subcategory}</div>`;
                series.items.forEach(item => {
                    html += `
                        <div class="shisha-item">
                            <div class="shisha-names">
                                <h4>${item[0]} <span>${item[1]}</span></h4>
                                <div class="shisha-desc">${item[2]}</div>
                            </div>
                            <div class="shisha-price">${item[3]}</div>
                        </div>`;
                });
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        function scrollToSub(subId) {
            const el = document.getElementById(subId);
            if(el) {
                const headerOffset = 130;
                const elementPosition = el.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                window.scrollTo({ top: offsetPosition, behavior: "smooth" });
            }
            document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');
        }

        const modal = document.getElementById('productModal');
        function openModal(nameEn, nameCn, desc, price, allergens, imgPath, isRevo, imgPos, imgTrans) {
            document.getElementById('modalNameEn').innerHTML = nameEn;
            document.getElementById('modalAllergens').innerHTML = allergens;
            document.getElementById('modalDesc').innerHTML = desc;
            document.getElementById('modalPrice').innerHTML = price;
            
            /* Gère l'affichage du chinois proprement (se cache si vide) */
            let cnEl = document.getElementById('modalNameCn');
            if (nameCn && nameCn.trim() !== '') {
                cnEl.innerHTML = nameCn;
                cnEl.style.display = 'block';
            } else {
                cnEl.style.display = 'none';
            }
            
            let badgeColor = isRevo ? 'e11d48' : 'f5a623';
            let imgSrc = (imgPath && imgPath !== 'undefined' && imgPath !== 'NaN') ? imgPath : `https://via.placeholder.com/600x450/161310/${badgeColor}?text=${encodeURIComponent(nameEn)}`;
            
            let modalImgEl = document.getElementById('modalImg');
            modalImgEl.src = imgSrc;
            
            if (isRevo) {
                modalImgEl.style.aspectRatio = '4/5'; /* Format POST INSTAGRAM */
                modalImgEl.style.objectFit = 'cover';
            } else {
                modalImgEl.style.aspectRatio = '4/3';
                modalImgEl.style.objectFit = 'cover';
            }
            
            /* Applique le positionnement et le zoom sur-mesure même dans la modale */
            modalImgEl.style.objectPosition = imgPos && imgPos !== 'undefined' ? imgPos : 'center';
            modalImgEl.style.transform = imgTrans && imgTrans !== 'undefined' ? imgTrans : 'scale(1)';
            
            modal.classList.add('active');
        }

        function closeModal() { modal.classList.remove('active'); }
        window.onclick = function(event) { if (event.target == modal) closeModal(); }

        // Lancement par défaut
        selectCategory('lupita', 'finger', 'Finger Food', '#f5a623');
    </script>
</body>
</html>
